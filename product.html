    <link rel="stylesheet" href="style.css">
    <title>Product Details | arhyXL</title>

<body>
    <header class="site-header">
        <a class="brand" href="index.html">
            <img src="Logo.jpeg" alt="arhyXL Logo">
        </a>
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="shop.html">Shop</a>
            <a href="contact.html">Contact</a>
        </nav>
        <div class="header-actions">
            <a class="btn btn-outline cart-link" href="cart.html">Cart <span class="cart-count" id="cart-count">0</span></a>
            <a class="btn btn-outline" href="login.html">Login</a>
        </div>
    </header>

    <main class="page-shell">
        <section class="product-detail-grid">
            <div class="product-detail-media">
                <img id="detail-image" src="" alt="Selected shoe">
            </div>
            <div class="product-detail-copy">
                <p class="eyebrow">Selected product</p>
                <h1 id="detail-title">Product</h1>
                <p id="detail-price" class="price">₦0</p>
                <p id="detail-description" class="page-text"></p>
                <p class="availability-text">Available now</p>

                <div class="picker-wrap">
                    <label for="detail-color">Colorway</label>
                    <select id="detail-color"></select>
                </div>

                <div class="picker-wrap">
                    <label for="detail-size">Size</label>
                    <select id="detail-size"></select>
                </div>

                <div class="picker-wrap">
                    <label for="detail-quantity">Quantity</label>
                    <select id="detail-quantity">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </div>

                <div class="picker-wrap">
                    <label for="detail-note">Note</label>
                    <textarea id="detail-note" rows="4" placeholder="Add a note for this product"></textarea>
                </div>

                <div class="picker-wrap">
                    <span class="picker-label">Rating</span>
                    <div class="star-rating" id="detail-rating" role="radiogroup" aria-label="Rate this product">
                        <button type="button" class="rating-star" data-rating="1" role="radio" aria-label="1 star" aria-checked="false">&#9733;</button>
                        <button type="button" class="rating-star" data-rating="2" role="radio" aria-label="2 stars" aria-checked="false">&#9733;</button>
                        <button type="button" class="rating-star" data-rating="3" role="radio" aria-label="3 stars" aria-checked="false">&#9733;</button>
                        <button type="button" class="rating-star" data-rating="4" role="radio" aria-label="4 stars" aria-checked="false">&#9733;</button>
                        <button type="button" class="rating-star" data-rating="5" role="radio" aria-label="5 stars" aria-checked="false">&#9733;</button>
                    </div>
                </div>

                <div class="product-actions">
                    <button class="btn btn-primary" id="add-to-cart">Add to cart</button>
                </div>
            </div>
        </section>
    </main>

        const params = new URLSearchParams(window.location.search);
        const productId = params.get('product');
        const selectedVariant = params.get('variant');

        const product = products[productId];
        if (!product) {
            document.querySelector('.product-detail-copy').innerHTML = '<h1>Product not found</h1>';
        } else {
            document.getElementById('detail-title').textContent = product.title;
            document.getElementById('detail-price').textContent = product.price;
            document.getElementById('detail-description').textContent = product.description;

            const colorSelect = document.getElementById('detail-color');
            const sizeSelect = document.getElementById('detail-size');
            const image = document.getElementById('detail-image');
            const ratingStars = document.querySelectorAll('.rating-star');
            let selectedRating = 0;

            const updateRating = (rating) => {
                selectedRating = rating;
                ratingStars.forEach((star) => {
                    const isSelected = Number(star.dataset.rating) <= rating;
                    star.classList.toggle('selected', isSelected);
                    star.setAttribute('aria-checked', String(Number(star.dataset.rating) === rating));
                });
            };

            ratingStars.forEach((star) => {
                star.addEventListener('click', () => updateRating(Number(star.dataset.rating)));
            });

            product.options.forEach((option) => {
                const optionEl = document.createElement('option');
                optionEl.value = option.value;
                optionEl.textContent = option.label;
                colorSelect.appendChild(optionEl);
            });

            product.sizes.forEach((size) => {
                const sizeEl = document.createElement('option');
                sizeEl.value = size;
                sizeEl.textContent = size;
                sizeSelect.appendChild(sizeEl);
            });

            const initialIndex = product.options.findIndex((option) => selectedVariant && decodeURIComponent(selectedVariant) === option.value);
            const initialOption = initialIndex >= 0 ? product.options[initialIndex] : product.options[0];
            colorSelect.value = initialOption.value;
            image.src = initialOption.value;
            image.alt = initialOption.label;

            colorSelect.addEventListener('change', () => {
                const nextOption = product.options.find((option) => option.value === colorSelect.value);
                if (nextOption) {
                    image.src = nextOption.value;
                    image.alt = nextOption.label;
                    document.getElementById('detail-price').textContent = nextOption.price;
                }
            });

            document.getElementById('add-to-cart').addEventListener('click', async () => {
                if (!requireLogin()) return;
                const quantity = parseInt(document.getElementById('detail-quantity').value, 10) || 1;
                try {
                    await apiRequest('/cart', {
                        method: 'POST',
                        body: JSON.stringify({
                            productId,
                            variant: colorSelect.value,
                            size: sizeSelect.value,
                            note: document.getElementById('detail-note').value,
                            rating: selectedRating,
                            quantity
                        })
                    });
                    window.location.href = 'cart.html';
                } catch (error) {
                    alert(error.message);
                }
            });
        }
