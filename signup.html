<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sign up | arhyXL</title>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html"><img src="Logo.jpeg" alt="arhyXL Logo"></a>
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="shop.html">Shop</a>
            <a href="contact.html">Contact</a>
        </nav>
        <div class="header-actions">
            <a class="btn btn-outline" href="login.html">Login</a>
            <a class="btn btn-outline" href="cart.html">Cart</a>
        </div>
    </header>

    <main class="auth-shell">
        <section class="auth-card">
            <p class="eyebrow">Join arhyXL</p>
            <h1>Create your account</h1>
            <p class="page-text">Save your details and make checkout easier.</p>
            <form id="signup-form" class="auth-form">
                <label for="signup-name">Full name</label>
                <input id="signup-name" type="text" required autocomplete="name">
                <label for="signup-email">Email address</label>
                <input id="signup-email" type="email" required autocomplete="email">
                <label for="signup-password">Password</label>
                <input id="signup-password" type="password" minlength="6" required autocomplete="new-password">
                <button class="btn btn-primary" type="submit">Sign up</button>
                <p id="signup-status" class="form-status" role="status"></p>
            </form>
            <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
        </section>
    </main>

    <script src="api-client.js"></script>
    <script>
        const signupStatus = document.getElementById('signup-status');
        document.getElementById('signup-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            signupStatus.textContent = 'Creating your account...';
            try {
                const data = await apiRequest('/auth/signup', {
                    method: 'POST',
                    body: JSON.stringify({
                        name: document.getElementById('signup-name').value,
                        email: document.getElementById('signup-email').value,
                        password: document.getElementById('signup-password').value
                    })
                });
                saveSession(data);
                window.location.href = 'index.html';
            } catch (error) {
                signupStatus.textContent = error.message;
            }
        });
    </script>
</body>
</html>
