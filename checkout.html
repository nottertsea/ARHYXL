<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Checkout | arhyXL</title>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html"><img src="Logo.jpeg" alt="arhyXL Logo"></a>
        <nav class="main-nav"><a href="index.html">Home</a><a href="about.html">About</a><a href="shop.html">Shop</a><a href="contact.html">Contact</a></nav>
        <div class="header-actions"><a class="btn btn-outline" href="cart.html">Back to cart</a><a class="btn btn-outline" href="contact.html">Contact</a></div>
    </header>
    <main class="auth-shell">
        <section class="auth-card checkout-card">
            <p class="eyebrow">Checkout</p>
            <h1>Delivery details</h1>
            <div id="checkout-items" class="checkout-items"></div>
            <div class="checkout-total"><span>Total</span><strong id="checkout-total">₦0</strong></div>
            <form id="checkout-form" class="auth-form">
                <label for="checkout-name">Full name</label><input id="checkout-name" type="text" required autocomplete="name">
                <label for="checkout-email">Email address</label><input id="checkout-email" type="email" required autocomplete="email">
                <label for="checkout-phone">Phone number</label><input id="checkout-phone" type="tel" required autocomplete="tel">
                <label for="checkout-address">Delivery address</label><textarea id="checkout-address" rows="5" required autocomplete="street-address"></textarea>
                <button class="btn btn-primary" type="submit">Pay Now</button>
                <p id="checkout-status" class="form-status" role="status"></p>
            </form>
        </section>
    </main>
    <script src="api-client.js"></script>
    <script>
        const itemsElement = document.getElementById('checkout-items');
        const totalElement = document.getElementById('checkout-total');
        const statusElement = document.getElementById('checkout-status');
        let cart = [];
        const formatPrice = (value) => new Intl.NumberFormat('en-NG', { style: 'currency', currency: 'NGN', maximumFractionDigits: 0 }).format(value);
        const selectedIds = new Set((new URLSearchParams(window.location.search).get('items') || '').split(',').map(Number).filter(Number.isInteger));
        const idempotencyKey = sessionStorage.getItem('arhyxl-checkout-key') || (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`);
        sessionStorage.setItem('arhyxl-checkout-key', idempotencyKey);

        const loadCheckout = async () => {
            if (!requireLogin()) return;
            try {
                cart = (await apiRequest('/cart')).filter((item) => selectedIds.has(item.id));
                if (!cart.length) { window.location.href = 'cart.html'; return; }
                itemsElement.innerHTML = cart.map((item) => `<p>${item.title} (${item.quantity}) <strong>${formatPrice(item.lineTotal)}</strong></p>`).join('');
                totalElement.textContent = formatPrice(cart.reduce((total, item) => total + item.lineTotal, 0));
                const user = getSavedUser();
                if (user) { document.getElementById('checkout-name').value = user.name || ''; document.getElementById('checkout-email').value = user.email || ''; }
            } catch (error) { statusElement.textContent = error.message; }
        };

        document.getElementById('checkout-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            statusElement.textContent = 'Connecting to Paystack...';
            try {
                const data = await apiRequest('/orders/initialize', { method: 'POST', body: JSON.stringify({
                    name: document.getElementById('checkout-name').value,
                    email: document.getElementById('checkout-email').value,
                    phone: document.getElementById('checkout-phone').value,
                    address: document.getElementById('checkout-address').value,
                    itemIds: cart.map((item) => item.id),
                    idempotencyKey
                }) });
                if (!data.authorizationUrl) throw new Error('Paystack did not return a checkout URL.');
                window.location.href = data.authorizationUrl;
            } catch (error) {
                console.error('Paystack checkout initialization failed:', error);
                statusElement.textContent = error.message;
            }
        });
        loadCheckout();
    </script>
</body>
</html>
