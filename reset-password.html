<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Reset Password | arhyXL</title>
</head>
<body>
    <header class="site-header"><a class="brand" href="index.html"><img src="Logo.jpeg" alt="arhyXL Logo"></a><nav class="main-nav"><a href="index.html">Home</a><a href="shop.html">Shop</a></nav></header>
    <main class="auth-shell"><section class="auth-card"><p class="eyebrow">Account recovery</p><h1>Reset your password</h1><form id="reset-form" class="auth-form"><label for="new-password">New password</label><input id="new-password" type="password" minlength="6" required autocomplete="new-password"><button class="btn btn-primary">Reset password</button><p id="reset-status" class="form-status" role="status"></p></form></section></main>
    <script src="api-client.js"></script>
    <script>
        const token = new URLSearchParams(window.location.search).get('token');
        const form = document.getElementById('reset-form');
        const status = document.getElementById('reset-status');
        if (!token) { form.hidden = true; status.textContent = 'This password reset link is missing or invalid.'; }
        form.addEventListener('submit', async (event) => { event.preventDefault(); status.textContent = 'Resetting password...'; try { await apiRequest('/auth/reset-password', { method: 'POST', body: JSON.stringify({ token, password: document.getElementById('new-password').value }) }); status.textContent = 'Password reset. Redirecting to login...'; window.setTimeout(() => { window.location.href = 'login.html'; }, 900); } catch (error) { status.textContent = error.message; } });
    </script>
</body>
</html>
